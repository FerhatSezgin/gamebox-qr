<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GAMEBOX | Cafe Menü</title>
  <meta name="theme-color" content="#090b10">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <!-- Header: Marka & Arama -->
    <header class="header">
      <div class="brand-section">
        <div class="brand-title">GAME<span class="accent">BOX</span></div>
        <div class="brand-subtitle">PlayStation & Cafe Menü</div>
      </div>

      <!-- Sade Arama Kutusu -->
      <div class="search-wrapper">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input type="text" id="searchInput" class="search-input" placeholder="Ürün ara...">
        <button type="button" id="searchClear" class="search-clear">✕</button>
      </div>
    </header>

    <!-- Kategori Barı (Sabit / Sticky) -->
    <div class="category-nav-wrapper">
      <div class="category-chips" id="categoryChips">
        <!-- JS ile doldurulacak -->
      </div>
    </div>

    <!-- Menü Ürünleri Listesi -->
    <main id="mainContent">
      <!-- JS ile doldurulacak -->
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>GAMEBOX PLAYSTATION & CAFE</p>
    </footer>
  </div>

  <!-- ===================================================================
       BÜYÜK ÜRÜN ÖNİZLEME MODALI
       =================================================================== -->
  <div class="preview-modal-backdrop" id="previewModal">
    <div class="preview-card">
      <button type="button" class="preview-close-btn" data-close-modal>✕</button>
      
      <div class="preview-img-container">
        <img id="previewImg" src="" alt="Ürün Görseli">
      </div>
      
      <h3 class="preview-title" id="previewTitle">Ürün Adı</h3>
      <p class="preview-desc" id="previewDesc">Ürün Açıklaması</p>
      
      <div class="preview-price" id="previewPrice">0 ₺</div>
    </div>
  </div>

  <!-- JS -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
