<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAMEBOX | Menü QR Kod & Stand Kartı Üretici</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .generator-wrap {
      max-width: 860px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .settings-box {
      background: #111522;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin: 16px 0;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      background: #0b0e17;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .form-input:focus {
      outline: none;
      border-color: rgba(56, 189, 248, 0.4);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-create {
      background: #1e2538;
      border: 1px solid var(--border-hover);
      color: #fff;
      padding: 11px 22px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-print-action {
      background: #fff;
      color: #000;
      border: none;
      padding: 11px 24px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Kartlar */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .menu-tent-card {
      background: #111522;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 30px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .theme-light {
      background: #ffffff !important;
      color: #0f172a !important;
      border: 1px dashed #cbd5e1 !important;
    }
    .theme-light .card-brand-title { color: #0f172a !important; }
    .theme-light .card-subtext { color: #64748b !important; }

    .card-brand-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
    }

    .card-subtext {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 16px;
      font-weight: 600;
    }

    .qr-box {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .card-prompt {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 14px;
    }
    .theme-light .card-prompt { color: #475569 !important; }

    /* Print Stilleri */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }
      .settings-box, .btn-row, .header, .footer { display: none !important; }
      .generator-wrap { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .cards-grid {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 15mm !important;
      }
      .menu-tent-card {
        border: 1px dashed #999 !important;
        box-shadow: none !important;
      }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body>

  <div class="generator-wrap">
    <div class="settings-box">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div>
          <h1 style="font-size: 1.25rem; font-weight: 800; color: #fff;">
            GAMEBOX Menü QR Kart Üretici
          </h1>
          <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 2px;">
            Masalara koymak üzere A4 sayfasında yazdırabileceğiniz hazır QR kod kartları.
          </p>
        </div>
        <a href="index.html" class="btn-create" style="text-decoration: none;">Menüyü Gör</a>
      </div>

      <div class="form-row">
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Menü Linki:</label>
          <input type="text" id="siteUrl" class="form-input" value="https://ferhatsezgin.github.io/gamebox-qr/">
        </div>

        <div class="form-group">
          <label>Kart Adedi (Baskı Sayısı):</label>
          <input type="number" id="cardCount" class="form-input" value="6" min="1" max="24">
        </div>

        <div class="form-group">
          <label>Baskı Teması:</label>
          <select id="themeSelect" class="form-input">
            <option value="light">Mürekkep Tasarruflu (Beyaz Zemin)</option>
            <option value="dark">Koyu Zemin (Dark)</option>
          </select>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn-create" id="btnRefresh">Yenile</button>
        <button type="button" class="btn-print-action" id="btnPrint">Masa Kartlarını Yazdır (A4)</button>
      </div>
    </div>

    <div class="cards-grid" id="cardsGrid">
      <!-- Dinamik kartlar buraya eklenecek -->
    </div>
  </div>

  <script src="js/qrcode.min.js"></script>
  <script src="js/data.js"></script>
  <script>
    (function() {
      const siteUrl = document.getElementById("siteUrl");
      const cardCount = document.getElementById("cardCount");
      const themeSelect = document.getElementById("themeSelect");
      const cardsGrid = document.getElementById("cardsGrid");
      const btnRefresh = document.getElementById("btnRefresh");
      const btnPrint = document.getElementById("btnPrint");

      function renderCards() {
        cardsGrid.innerHTML = "";
        const url = siteUrl.value.trim() || "https://ferhatsezgin.github.io/gamebox-qr/";
        const count = parseInt(cardCount.value) || 6;
        const theme = themeSelect.value === "light" ? "theme-light" : "";

        for (let i = 1; i <= count; i++) {
          const card = document.createElement("div");
          card.className = `menu-tent-card ${theme}`;
          const qrId = `qr-code-${i}`;

          card.innerHTML = `
            <div class="card-brand-title">GAMEBOX</div>
            <div class="card-subtext">PlayStation & Cafe</div>

            <div class="qr-box" id="${qrId}"></div>

            <div class="card-prompt">Kameranla Tara & Menüyü İncele</div>
            <div style="font-size: 0.65rem; color: #64748b; margin-top: 14px; font-style: italic;">✂ Kesim çizgisi</div>
          `;

          cardsGrid.appendChild(card);

          new QRCode(document.getElementById(qrId), {
            text: url,
            width: 140,
            height: 140,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      }

      btnRefresh.onclick = renderCards;
      btnPrint.onclick = () => window.print();
      themeSelect.onchange = renderCards;

      renderCards();
    })();
  </script>
</body>
</html>
