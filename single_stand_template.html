<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>GAMEBOX Büyük Stand QR</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap');

    @page {
      size: A4 portrait;
      margin: 15mm;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
      width: 180mm;
      height: 260mm;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid #090d16;
      border-radius: 28px;
      padding: 40px 30px;
      text-align: center;
    }

    .brand-title {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #090d16;
      margin-bottom: 4px;
    }

    .brand-sub {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 36px;
    }

    .qr-frame {
      background: #ffffff;
      padding: 24px;
      border-radius: 24px;
      border: 2px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      margin-bottom: 36px;
      display: inline-block;
    }

    .callout-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #090d16;
      text-transform: uppercase;
    }

    .callout-desc {
      font-size: 15px;
      color: #64748b;
      margin-top: 8px;
      font-weight: 500;
    }

    .footer-url {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 30px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div>
    <div class="brand-title">GAMEBOX</div>
    <div class="brand-sub">PLAYSTATION & CAFE</div>
  </div>

  <div class="qr-frame" id="bigQr"></div>

  <div>
    <div class="callout-title">DİJİTAL MENÜ</div>
    <div class="callout-desc">Telefonunuzun kamerasıyla QR kodu taratarak<br>güncel menüyü ve fiyatları inceleyebilirsiniz.</div>
  </div>

  <div class="footer-url">ferhatsezgin.github.io/gamebox-qr/</div>

  <script src="js/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("bigQr"), {
      text: "https://ferhatsezgin.github.io/gamebox-qr/",
      width: 260,
      height: 260,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
